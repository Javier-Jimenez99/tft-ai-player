[project]
name = "tft-ai-player"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "javier-jimenezdelajara-int_nestle", email = "Javier.JimenezdelaJara@nestle.com" }
]
requires-python = ">=3.14"
dependencies = [
    "ipykernel>=6.29.0",
    "lightgbm>=4.7.0",
    "matplotlib>=3.8.0",
    "pandas>=2.2.0",
    "scikit-learn>=1.9.0",
    "scipy>=1.18.0",
    "seaborn>=0.13.0",
    "tqdm>=4.67",
    "xgboost>=3.4.0",
]

[project.scripts]
tft-ai-player = "tft_ai_player.cli:main"

[build-system]
requires = ["uv_build>=0.11.3,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
